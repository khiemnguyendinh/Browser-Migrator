name: Build Windows EXE

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install click rich cryptography "pywebview>=5.0.0" pywin32
          Write-Host "Runtime deps installed OK"

      - name: Install build and test tools
        run: |
          pip install "pyinstaller>=6.3.0" pytest pytest-cov
          Write-Host "Build tools installed OK"

      - name: Run tests
        run: |
          $env:PYTHONPATH = "src"
          pytest tests/ -v --tb=short
        env:
          CPM_TEST_MODE: "1"
          CPM_MOCK_KEYCHAIN: "mock_master_ci_test_key"

      - name: Build Windows EXE
        run: |
          python -m PyInstaller `
            --clean --noconfirm `
            --noconsole `
            --onedir `
            --name=ChromiumBrowserMigrator `
            "--add-data=src/cpm/m09_gui/web;cpm/m09_gui/web" `
            --collect-all=cpm `
            --collect-all=webview `
            --hidden-import=webview `
            --hidden-import=webview.platforms.edgechromium `
            --hidden-import=webview.platforms.winforms `
            src/cpm/m09_gui/app.py
          Write-Host "PyInstaller build completed"
          Get-ChildItem dist\ChromiumBrowserMigrator\ | Select-Object Name, Length

      - name: Package into ZIP
        run: |
          Compress-Archive `
            -Path dist\ChromiumBrowserMigrator\* `
            -DestinationPath dist\ChromiumBrowserMigrator-Windows.zip
          Write-Host "ZIP created"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChromiumBrowserMigrator-Windows
          path: dist/ChromiumBrowserMigrator-Windows.zip
          retention-days: 30
