name: Build Windows EXE

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install pywin32

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Build Windows EXE
        run: |
          python -m PyInstaller --clean --noconfirm ^
            --noconsole ^
            --onefile ^
            --name=ChromiumBrowserMigrator ^
            --add-data="src/cpm/m09_gui/web;cpm/m09_gui/web" ^
            --collect-all=cpm ^
            src/cpm/m09_gui/app.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChromiumBrowserMigrator-Windows
          path: dist/ChromiumBrowserMigrator.exe
          retention-days: 30
