[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cpm"
version = "0.1.0"
description = "Chromium Profile Migrator for macOS"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "cryptography>=42.0.5",
    "pywebview>=5.0.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.2",
    "black>=24.2.0",
    "pyinstaller>=6.3.0",
]

[project.scripts]
cpm = "cpm.m06_cli.main:cli"

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
