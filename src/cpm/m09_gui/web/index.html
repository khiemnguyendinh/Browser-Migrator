<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromium Profile Migrator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="app-container">
        <header>
            <h1>Chromium Browser <span>Migrator</span></h1>
            <p>Seamlessly transfer your browsing life.</p>
        </header>

        <main>
            <div class="glass-card selection-area">
                <div class="browser-select">
                    <label for="source-browser">Source Browser</label>
                    <div class="select-wrapper">
                        <select id="source-browser" disabled>
                            <option value="">Scanning browsers...</option>
                        </select>
                    </div>
                </div>

                <div class="transfer-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </div>

                <div class="browser-select">
                    <label for="target-browser">Target Browser</label>
                    <div class="select-wrapper">
                        <select id="target-browser" disabled>
                            <option value="">Scanning browsers...</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="glass-card options-area">
                <h3>Select Data to Migrate</h3>
                <div class="options-grid">
                    <label class="toggle-switch">
                        <input type="checkbox" id="opt-passwords" checked>
                        <span class="slider"></span>
                        <span class="label-text">Passwords</span>
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="opt-cookies" checked>
                        <span class="slider"></span>
                        <span class="label-text">Cookies</span>
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="opt-bookmarks" checked>
                        <span class="slider"></span>
                        <span class="label-text">Bookmarks</span>
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="opt-history" checked>
                        <span class="slider"></span>
                        <span class="label-text">History</span>
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="opt-autofill" checked>
                        <span class="slider"></span>
                        <span class="label-text">Auto Fill</span>
                    </label>
                    <label class="toggle-switch disabled">
                        <input type="checkbox" id="opt-extensions" disabled>
                        <span class="slider" style="background-color: rgba(239, 68, 68, 0.2);"></span>
                        <span class="label-text" style="opacity: 0.7;">Extensions <span class="badge" style="background: rgba(239, 68, 68, 0.2); color: #fca5a5;">Unsafe</span></span>
                    </label>
                </div>
            </div>

            <button id="migrate-btn" class="primary-btn glass-btn" disabled>
                <span class="btn-text">Start Migration</span>
                <div class="loader hidden"></div>
            </button>

            <div id="status-console" class="glass-card status-console hidden">
                <h3>Migration Status</h3>
                <div id="log-messages" class="log-messages"></div>
            </div>
        </main>

        <footer>
            <p>Copyright &copy; 2026 - Kstudy Academy</p>
            <p>Khiem Nguyen Dinh - <a href="http://www.kstudy.edu.vn" target="_blank" rel="noopener noreferrer">www.kstudy.edu.vn</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
